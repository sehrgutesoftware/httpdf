name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check that the Dockerfile uses the Go version from go.mod
        run: |
          gomod=$(go mod edit -json | jq -r .Go)
          dockerfile=$(sed -n 's/^ARG GOLANG_VERSION=//p' Dockerfile)
          if [ "$gomod" != "$dockerfile" ]; then
            echo "::error file=Dockerfile::GOLANG_VERSION is $dockerfile, but go.mod requires $gomod"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          for file in $unformatted; do
            echo "::error file=$file::$file isn't formatted, run gofmt -w $file"
          done
          [ -z "$unformatted" ]

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./... -coverprofile=coverage.txt -covermode=atomic

  integration:
    # The renderer tests need Chromium, so they run in the development image,
    # which has the same Chromium as the production image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: hot-reload
          load: true
          tags: httpdf-dev
          cache-from: type=gha,scope=hot-reload
          cache-to: type=gha,scope=hot-reload,mode=max

      - name: Run renderer tests
        shell: bash # with pipefail, so a failing test fails the step despite tee
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint go \
            -e HTTPDF_TEST_CHROMIUM=/usr/bin/chromium-headless-shell \
            httpdf-dev test -v ./internal/pdf/ | tee "$RUNNER_TEMP/test.log"
          # The renderer tests skip themselves if HTTPDF_TEST_CHROMIUM isn't set
          if grep -q -- '--- SKIP: TestRodRenderer' "$RUNNER_TEMP/test.log"; then
            echo "::error file=internal/pdf/renderer_test.go::TestRodRenderer was skipped"
            exit 1
          fi

  build:
    # The image is only built and published for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{ major }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=semver,pattern={{ version }}
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64, linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check that the Dockerfile uses the Go version from go.mod
        run: |
          gomod=$(go mod edit -json | jq -r .Go)
          dockerfile=$(sed -n 's/^ARG GOLANG_VERSION=//p' Dockerfile)
          if [ "$gomod" != "$dockerfile" ]; then
            echo "::error file=Dockerfile::GOLANG_VERSION is $dockerfile, but go.mod requires $gomod"
            exit 1
          fi

      - name: Run tests
        run: go test -v ./... -coverprofile=coverage.txt -covermode=atomic

  build:
    # The image is only built and published for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{ major }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=semver,pattern={{ version }}
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64, linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha

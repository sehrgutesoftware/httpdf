name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Releases are tagged with their version (latest is added automatically),
  # pushes to main with the short commit sha. The first tag becomes the image's
  # version label and the version stamped into the binary.
  IMAGE_TAGS: |
    type=semver,pattern={{ version }}
    type=semver,pattern={{ major }}.{{ minor }}
    type=semver,pattern={{ major }}
    type=sha,prefix=,enable={{ is_default_branch }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check that the Dockerfile uses the Go version from go.mod
        run: |
          gomod=$(go mod edit -json | jq -r .Go)
          dockerfile=$(sed -n 's/^ARG GOLANG_VERSION=//p' Dockerfile)
          if [ "$gomod" != "$dockerfile" ]; then
            echo "::error file=Dockerfile::GOLANG_VERSION is $dockerfile, but go.mod requires $gomod"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          for file in $unformatted; do
            echo "::error file=$file::$file isn't formatted, run gofmt -w $file"
          done
          [ -z "$unformatted" ]

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./... -coverprofile=coverage.txt -covermode=atomic

  integration:
    # The renderer tests need Chromium, so they run in the development image,
    # which has the same Chromium as the production image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the development image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: hot-reload
          load: true
          tags: httpdf-dev
          cache-from: type=gha,scope=hot-reload
          cache-to: type=gha,scope=hot-reload,mode=max

      - name: Run renderer tests
        shell: bash # with pipefail, so a failing test fails the step despite tee
        run: |
          docker run --rm -v "$PWD:/app" --entrypoint go \
            -e HTTPDF_TEST_CHROMIUM=/usr/bin/chromium-headless-shell \
            httpdf-dev test -v ./internal/pdf/ | tee "$RUNNER_TEMP/test.log"
          # The renderer tests skip themselves if HTTPDF_TEST_CHROMIUM isn't set
          if grep -q -- '--- SKIP: TestRodRenderer' "$RUNNER_TEMP/test.log"; then
            echo "::error file=internal/pdf/renderer_test.go::TestRodRenderer was skipped"
            exit 1
          fi

  build:
    # Each platform is built natively on its own runner, in parallel with the
    # tests, and pushed untagged, by digest. The merge job tags them once all
    # tests have passed.
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Combines the per-platform images into one multi-platform image and tags
    # it, but only if the tests and both builds succeeded
    needs: [test, integration, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAGS }}

      - name: Create and push the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
